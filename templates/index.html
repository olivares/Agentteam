<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soporte MrBogart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrap {
      width: 100%;
      max-width: 700px;
      height: 94vh;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 6px 32px rgba(0,0,0,.13);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: #111827;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .avatar {
      width: 44px; height: 44px;
      background: #4f46e5;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-info h2 { color: #fff; font-size: 16px; font-weight: 600; }
    .header-info p  { color: #9ca3af; font-size: 13px; margin-top: 2px; }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 5px;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 82%;
      animation: pop .18s ease;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    .msg.bot  { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .bot-icon {
      width: 32px; height: 32px;
      background: #111827;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 12px 16px;
      font-size: 14.5px;
      line-height: 1.55;
      border-radius: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot  .bubble {
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex; align-items: center; gap: 5px;
      padding: 14px 16px;
      background: #f3f4f6;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* ── Input area ── */
    .input-area {
      padding: 14px 18px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14.5px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 130px;
      line-height: 1.45;
      transition: border-color .2s;
    }
    textarea:focus { border-color: #4f46e5; }
    textarea:disabled { background: #f9fafb; }

    button#send {
      background: #4f46e5;
      border: none;
      border-radius: 12px;
      width: 46px; height: 46px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .2s, opacity .2s;
    }
    button#send:hover   { background: #4338ca; }
    button#send:disabled { opacity: .5; cursor: not-allowed; }
    button#send svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="chat-wrap">

    <div class="header">
      <div class="avatar">🤝</div>
      <div class="header-info">
        <h2>Soporte MrBogart</h2>
        <p><span class="dot"></span>En línea</p>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <textarea id="input" placeholder="Escribe tu mensaje…" rows="1"></textarea>
      <button id="send" onclick="sendMessage()" title="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>

  <script>
    const msgsEl  = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let busy = false;

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
    });

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function scroll() {
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    function addMsg(text, role) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const bubble = `<div class="bubble">${text}</div>`;
      if (role === 'bot') {
        div.innerHTML = `<div class="bot-icon">🤝</div>${bubble}`;
      } else {
        div.innerHTML = bubble;
      }
      msgsEl.appendChild(div);
      scroll();
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'msg bot';
      el.id = 'typing';
      el.innerHTML = `
        <div class="bot-icon">🤝</div>
        <div class="typing-dots"><span></span><span></span><span></span></div>
      `;
      msgsEl.appendChild(el);
      scroll();
    }

    function removeTyping() {
      document.getElementById('typing')?.remove();
    }

    function setUI(disabled) {
      busy = disabled;
      inputEl.disabled = disabled;
      sendBtn.disabled = disabled;
    }

    // Formatea el texto: saltos de línea y negrita básica
    function format(text) {
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      addMsg(format(text), 'user');
      inputEl.value = '';
      inputEl.style.height = 'auto';
      setUI(true);
      showTyping();

      try {
        const res  = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        removeTyping();
        addMsg(format(data.reply), 'bot');
      } catch {
        removeTyping();
        addMsg('Ha ocurrido un error. Por favor, inténtalo de nuevo.', 'bot');
      } finally {
        setUI(false);
        inputEl.focus();
      }
    }

    // Saludo inicial automático
    async function init() {
      setUI(true);
      showTyping();
      try {
        const res  = await fetch('/start', { method: 'POST' });
        const data = await res.json();
        removeTyping();
        addMsg(format(data.reply), 'bot');
      } catch {
        removeTyping();
        addMsg('¡Hola! ¿En qué puedo ayudarte hoy?', 'bot');
      } finally {
        setUI(false);
        inputEl.focus();
      }
    }

    init();
  </script>
</body>
</html>
